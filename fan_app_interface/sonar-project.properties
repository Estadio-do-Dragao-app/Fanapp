sonar.projectKey=Estadio-do-Dragao-app_Fanapp
sonar.organization=fanapp-estadio-dragao
sonar.host.url=https://sonarcloud.io

# Name and version displayed in the SonarCloud UI
sonar.projectName=Fanapp Interface
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=lib
sonar.tests=test,integration_test

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Coverage report path (generated by flutter test --coverage)
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Files that cannot be properly unit-tested in CI due to native plugins
sonar.exclusions=**/*.g.dart,\
**/*.freezed.dart,\
lib/generated/**,\
lib/features/map/presentation/widgets/stadium_painter.dart,\
**/geographic_utils.dart,\
**/navigation_controller.dart,\
**/navigation_page.dart,\
**/home_view_model.dart,\
**/destination_selection.dart,\
**/fan_map_page.dart,\
**/permission_service.dart,\
**/mqtt_service.dart,\
**/waittime_cache.dart,\
**/user_position_service.dart,\
**/consent_modal.dart,\
**/bottom_sheet_search.dart
